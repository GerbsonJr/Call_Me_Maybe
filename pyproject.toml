[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with a small LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.0",
]

[tool.mypy]
files = ["src"]
exclude = [
    "^\\.venv/",
    "^llm_sdk/"
]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
